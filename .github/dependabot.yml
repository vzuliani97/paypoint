version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Major upgrades are planned migrations (e.g. NestJS 12 is ESM-only and must move as a set), not drive-by PRs.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Major upgrades are planned migrations (e.g. NestJS 12 is ESM-only and must move as a set), not drive-by PRs.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    ignore:
      # Stay on the Node.js LTS line; odd-numbered majors are not LTS.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
    ignore:
      # Stay on the Node.js LTS line; odd-numbered majors are not LTS.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
