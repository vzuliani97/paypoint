name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: jobs only read the repo unless they declare more.
permissions:
  contents: read

jobs:
  backend:
    name: Backend (typecheck, unit tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  frontend:
    name: Frontend (typecheck, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  integration:
    name: Integration tests (PostgreSQL) and Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare environment
        run: cp .env.example .env
      - name: Run unit and e2e tests against PostgreSQL
        run: docker compose --profile test run --rm --build backend-test
      - name: Build production images
        run: docker compose build backend frontend
      - name: Tear down
        if: always()
        run: docker compose --profile test down -v

  publish:
    name: Publish images to GHCR
    # Only after every check passed, and only for main: these images are what Argo CD deploys.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: paypoint-backend
            context: backend
            target: production
          - image: paypoint-frontend
            context: frontend
            target: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: true
          # "main" for the gitops overlay, the commit SHA for traceability and rollbacks.
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:main
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  security:
    name: Security (secrets, dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the whole history, not just the last commit
      - name: Scan git history for secrets (Gitleaks)
        run: docker run --rm -v "$PWD":/repo zricethezav/gitleaks:v8.30.1 git /repo --no-banner --redact
      - name: Audit production dependencies (backend)
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high
      - name: Audit production dependencies (frontend)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
