name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: jobs only read the repo unless they declare more.
permissions:
  contents: read

jobs:
  backend:
    name: Backend (typecheck, unit tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Published images carry no metadata (GPS, camera, capture time, XMP, IPTC)
        working-directory: .
        run: node scripts/image-metadata.mjs check docs
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  frontend:
    name: Frontend (typecheck, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  integration:
    name: Integration tests (PostgreSQL), image scan and DAST
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare environment
        run: cp .env.example .env
      - name: Run unit and e2e tests against PostgreSQL
        run: docker compose --profile test run --rm --build backend-test
      - name: Build production images
        run: docker compose build backend frontend
      # Security tools are pinned by digest, like actions by SHA: a moved tag cannot change what runs.
      # Only fixable findings block the build; an unfixed CVE has no upgrade to apply yet.
      - name: Scan images for fixable critical and high vulnerabilities (Trivy)
        run: |
          for image in nekobet-backend nekobet-frontend; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:0.69.3@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c \
              image --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed --no-progress "$image"
          done
      - name: Start the stack for the DAST scan
        run: docker compose up -d --wait backend frontend
      # Passive scan of the running app: headers, cookies, leaks. Any warning not accepted in
      # .zap/rules.tsv (each with its reason) fails the build.
      - name: DAST baseline scan (OWASP ZAP)
        run: |
          mkdir -p zap && cp .zap/rules.tsv zap/ && chmod -R a+rwX zap
          docker run --rm --network nekobet_default -v "$PWD/zap":/zap/wrk:rw \
            ghcr.io/zaproxy/zaproxy:2.17.0@sha256:030d3df57735dacbb83464854758e674dd9ad01d79d12a129a8e58b1fd384238 \
            zap-baseline.py -t http://frontend:8080 -c rules.tsv
      - name: Tear down
        if: always()
        run: docker compose --profile test down -v

  publish:
    name: Publish images to GHCR
    # Only after every check passed, and only for main: these images are what Argo CD deploys.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing: cosign proves this workflow's identity with GitHub's OIDC token
    strategy:
      matrix:
        include:
          - image: paypoint-backend
            context: backend
            target: production
          - image: paypoint-frontend
            context: frontend
            target: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # arm64 too: Apple Silicon laptops (kind) and AWS Graviton nodes can run the same images.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          # "main" for the gitops overlay, the commit SHA for traceability and rollbacks.
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:main
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          # Attached to the image in the registry: the SBOM (BuildKit generates it with Syft)
          # and SLSA build provenance (which commit and workflow produced it).
          sbom: true
          provenance: mode=max
      # Keyless: no private key to store or leak. The certificate names this workflow and commit,
      # and the signature is recorded in Sigstore's public transparency log (Rekor).
      - name: Sign the image (cosign)
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

  security:
    name: Security (secrets, dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the whole history, not just the last commit
      - name: Scan git history for secrets (Gitleaks)
        run: docker run --rm -v "$PWD":/repo zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /repo --no-banner --redact
      - name: Audit production dependencies (backend)
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high
      - name: Audit production dependencies (frontend)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
