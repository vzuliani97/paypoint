server {
  listen 8080;
  server_name _;
  # Answer as plain "nginx": the version in the banner would point attackers at specific CVEs.
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  # Fail fast when the backend is unreachable instead of hanging the client for nginx's 60 s default.
  proxy_connect_timeout 3s;
  proxy_read_timeout 30s;

  # Live odds over Server-Sent Events: no buffering, and a long read timeout for the open stream.
  location = /api/betting/stream {
    proxy_pass http://backend:3000/api/betting/stream;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location /api/ {
    proxy_pass http://backend:3000/api/;
    proxy_set_header Host $host;
    # The API trusts one proxy hop and reads the client IP from here (partner IP allowlist).
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /health {
    proxy_pass http://backend:3000/health;
  }

  # index.html is revalidated on every visit so a new deploy reaches browsers at once.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    expires -1;
    try_files $uri /index.html;
  }

  # Build assets carry a content hash in their file name, so browsers may keep them for a year.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    expires 1y;
  }
}
